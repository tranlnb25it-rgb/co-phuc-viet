  <!-- head facing left: open jaws, eye, flame mane, pearl -->
  <path fill="#5A3420" fill-opacity="0.05" stroke-width="1.5" d="M116 56C114 48 106 44 98 46C92 47 86 50 82 52L88 54C84 56 82 58 84 60C90 58 96 58 100 60C106 62 112 62 116 56Z"/>
  <path stroke-width="1.2" d="M82 52l-3-1M84 60l-3 1M86 53l2 2M87 58l2-2"/>
  <circle cx="103" cy="51" r="1.8" stroke-width="1.2"/>
  <path stroke-width="1.3" d="M110 47C108 40 112 34 118 33M114 49C116 42 122 40 126 42M106 46C102 40 102 34 106 30M117 54C122 52 126 54 127 59"/>
  <circle cx="74" cy="56" r="4" stroke-width="1.2"/>
