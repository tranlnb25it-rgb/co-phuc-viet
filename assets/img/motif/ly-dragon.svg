        d="M92 134C110 136 124 126 120 112C116 98 90 100 84 88C78 76 96 66 112 68C122 69 124 60 116 56
           L112 62C116 64 114 66 110 66C90 64 72 74 78 90C84 104 108 102 112 114C115 124 104 130 92 128C86 127 84 130 88 133Z"/>
