  <path stroke-width="2.6" stroke-dasharray="0 7" d="M100 21C111 41 135 57 138.5 88C142 118 122 140 100 149C78 140 58 118 61.5 88C65 57 89 41 100 21Z"/>
  <path stroke-width="1.1" d="M100 28C109 45 130 60 133 88C136 114 118 133 100 141C82 133 64 114 67 88C70 60 91 45 100 28Z"/>

  <!-- body: a solid S-coil, tail at the bottom, neck rising to the head -->
